<!doctype html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#090811">
    <title>Catch Brendan | London Comedy Group</title>
    <meta name="robots" content="noindex,nofollow">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap">
    <style>
        :root {
            --bg: #090811;
            --surface: #151222;
            --surface-2: #1f1931;
            --text: #fffafc;
            --muted: #c9beca;
            --pink: #ff3d8d;
            --blue: #7ce8ff;
            --red: #ff5a6e;
            --line: rgba(255,255,255,.14);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        [hidden] { display: none !important; }
        body {
            min-height: 100vh;
            background: var(--bg) radial-gradient(circle at 50% 0%, #241a3a 0%, var(--bg) 60%) no-repeat;
            color: var(--text);
            font-family: "Bricolage Grotesque", system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        button { font: inherit; color: inherit; }
        a { color: var(--blue); }

        /* Menu and prize pages */
        .page {
            width: min(100%, 560px);
            margin: 0 auto;
            padding: 16px 16px 48px;
            display: flex; flex-direction: column; align-items: center;
            text-align: center;
        }
        .page.wide { width: min(100%, 820px); }
        .back { align-self: flex-start; padding: 6px 0; font-size: .9rem; color: var(--muted); text-decoration: none; }
        .back:hover { color: var(--text); }
        h1 { font-size: clamp(2.2rem, 10vw, 3.6rem); line-height: 1; margin: 20px 0 10px; }
        h1 span, h2 span { color: var(--pink); }
        .lede { color: var(--muted); margin: 0 0 24px; max-width: 34ch; line-height: 1.4; }
        .modes { display: grid; gap: 12px; width: 100%; }
        .mode {
            display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
            width: 100%; padding: 16px 18px;
            text-align: left; cursor: pointer;
            background: var(--surface); border: 2px solid var(--line); border-radius: 16px;
            touch-action: manipulation;
        }
        .mode strong { font-size: 1.15rem; }
        .mode span { color: var(--muted); font-size: .92rem; line-height: 1.35; }
        .mode:hover, .mode:focus-visible { border-color: var(--pink); outline: none; }
        .quote { margin: 32px auto 0; max-width: 30ch; color: var(--muted); }
        .quote q { display: block; margin-bottom: 4px; color: var(--text); font-weight: 700; font-size: 1.1rem; }
        .btn {
            font-weight: 800; font-size: 1.05rem;
            background: var(--pink); color: #fff;
            border: 2px solid var(--pink); border-radius: 999px;
            padding: 12px 24px; cursor: pointer;
            touch-action: manipulation;
        }
        .btn.ghost { background: transparent; border-color: var(--line); }
        .btn:hover { filter: brightness(1.1); }
        .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }

        .prize .sub { color: var(--muted); margin: 0 0 18px; max-width: 40ch; line-height: 1.4; }
        .poster { width: 100%; height: auto; border-radius: 14px; box-shadow: 0 20px 55px rgba(0,0,0,.4); }
        .sage { display: flex; align-items: center; gap: 14px; margin: 26px auto 0; max-width: 460px; text-align: left; }
        .sage img {
            flex: none; width: 88px; height: 88px; border-radius: 50%;
            object-fit: cover; border: 3px solid var(--blue);
            animation: float 3s ease-in-out infinite;
        }
        .bubble {
            position: relative; margin: 0;
            background: var(--text); color: var(--bg);
            border-radius: 18px; padding: 12px 16px;
            font-weight: 700; font-size: 1.05rem; line-height: 1.3;
        }
        .bubble::before {
            content: ""; position: absolute; left: -9px; top: 50%; margin-top: -9px;
            border: 9px solid transparent; border-left: 0; border-right-color: var(--text);
        }
        .bubble small { display: block; margin-top: 4px; font-weight: 600; font-size: .8rem; color: #5b5266; }

        /* Game stage: full screen, split into one or two player sides */
        .stage {
            position: fixed; inset: 0; z-index: 10;
            display: flex; flex-direction: column;
            height: 100vh; height: 100dvh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background: var(--bg);
            touch-action: manipulation;
            user-select: none; -webkit-user-select: none;
        }
        .bar {
            flex: none;
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
            padding: 6px 12px;
            background: var(--surface);
            border-block: 1px solid var(--line);
        }
        .quit { justify-self: start; padding: 8px 4px; background: none; border: 0; color: var(--muted); font-weight: 700; cursor: pointer; }
        .clock { font-weight: 800; font-size: 1.5rem; font-variant-numeric: tabular-nums; min-width: 2.5ch; text-align: center; }
        .clock.low { color: var(--pink); }
        .label { justify-self: end; color: var(--muted); font-size: .85rem; font-weight: 700; }

        .side {
            --c: var(--pink);
            flex: 1 1 0; min-height: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 10px; padding: 10px 16px;
            overflow: hidden;
            container-type: size;
        }
        .side.p2 { --c: var(--blue); background: rgba(124,232,255,.05); }
        .side.elite { --c: var(--red); background: rgba(255,40,60,.09); }
        .side.flip { transform: rotate(180deg); }
        .hud { flex: none; display: flex; align-items: center; gap: 10px; font-weight: 800; white-space: nowrap; }
        .hud .name { color: var(--c); }
        .pips { display: flex; gap: 4px; }
        .pip { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); transition: background .15s, border-color .15s; }
        .pip.on { background: var(--c); border-color: var(--c); }

        .board {
            position: relative; flex: none;
            width: min(100%, 360px);
            width: min(100%, 360px, calc(100cqh - 40px));
        }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .hole {
            position: relative; aspect-ratio: 1; min-width: 0;
            padding: 0; overflow: hidden; cursor: pointer;
            background: var(--surface); border: 2px solid var(--line); border-radius: 50%;
            touch-action: manipulation;
        }
        .hole img {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; pointer-events: none;
            transform: translateY(105%); transition: transform .14s ease-out;
        }
        .hole.up img { transform: translateY(0); }
        .hole.hit { border-color: var(--c); }
        .hole.hit img { filter: saturate(0) brightness(1.4); }
        .hole.miss { animation: shake .25s; }
        .elite .hole { pointer-events: none; border-color: rgba(255,90,110,.35); }
        .elite .hole img { filter: hue-rotate(-40deg) saturate(1.8) contrast(1.15); }
        .elite .hole.hit { border-color: var(--red); }

        .flash {
            position: absolute; inset: -4px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 8px; text-align: center; pointer-events: none;
            font-weight: 800; line-height: 1.1;
            font-size: clamp(1.5rem, 11cqh, 3.2rem);
            background: rgba(9,8,17,.6); border-radius: 18px;
            text-shadow: 0 3px 18px rgba(0,0,0,.8);
            opacity: 0; transition: opacity .15s;
        }
        .flash.on { opacity: 1; }
        .flash small { display: block; margin-top: 6px; font-size: .42em; font-weight: 700; color: var(--muted); }

        .overlay {
            position: absolute; inset: 0; z-index: 2;
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
            background: rgba(9,8,17,.75);
            -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
        }
        .card {
            width: min(100%, 400px); max-height: 100%; overflow: auto;
            padding: 22px 20px;
            text-align: center;
            background: var(--surface-2); border: 1px solid var(--line); border-radius: 20px;
            box-shadow: 0 20px 55px rgba(0,0,0,.5);
            animation: pop .3s cubic-bezier(.2,1.5,.4,1);
        }
        .card h2 { margin: 0 0 8px; font-size: 1.6rem; line-height: 1.1; }
        .card p { margin: 0; color: var(--muted); line-height: 1.45; }
        .card .actions { margin-top: 18px; }

        .confetti { position: fixed; top: -12px; z-index: 20; width: 10px; height: 14px; pointer-events: none; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
        @keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
        @keyframes float { 50% { transform: translateY(-5px) rotate(-3deg); } }
        @media (prefers-reduced-motion: reduce) {
            .card, .sage img, .hole.miss { animation: none; }
            .confetti { display: none; }
        }
    </style>
</head>
<body>
    <main class="page" id="menu">
        <a class="back" href="/">← Back to London Comedy Group</a>
        <h1>Catch <span>Brendan</span></h1>
        <p class="lede">He keeps popping up. Catch him 7 times before the clock runs out to unlock a secret.</p>
        <div class="modes">
            <button class="mode" type="button" data-mode="solo"><strong>1 player</strong><span>Catch Brendan 7 times in 20 seconds.</span></button>
            <button class="mode" type="button" data-mode="versus"><strong>2 players: head to head</strong><span>One phone, sit opposite each other. First to 7 wins, then takes on the Elite Brendan.</span></button>
            <button class="mode" type="button" data-mode="team"><strong>2 players: team up</strong><span>One phone, sit opposite each other. You both need 7 to win.</span></button>
        </div>
        <p class="quote"><q>London Comedy Group is about community</q>– Ridwan Hussain</p>
    </main>

    <section class="stage" id="stage" hidden></section>

    <main class="page wide prize" id="prize" hidden>
        <a class="back" href="/">← Back to London Comedy Group</a>
        <h1 data-title></h1>
        <p class="sub" data-sub></p>
        <img class="poster" src="/bcg/brendan-comedy-group.jpg" width="1920" height="1080" alt="Brendan Comedy Group: Brendan Morris in a patchwork top and denim shorts, arms raised, next to the words Brendan Comedy Group">
        <figure class="sage">
            <img src="/ridwan-hussain.jpg" width="88" height="88" alt="Ridwan Hussain">
            <blockquote class="bubble">“Brendan Comedy Group is about community.”<small>– Ridwan Hussain, wise man</small></blockquote>
        </figure>
        <div class="actions">
            <button class="btn" type="button" data-again>Play again</button>
            <button class="btn ghost" type="button" data-menu>Menu</button>
        </div>
    </main>

    <script>
    (function () {
        var TARGET = 7, SECONDS = 20, COUNT_STEP = 700, RESULT_PAUSE = 1300;
        var menu = document.getElementById('menu');
        var stage = document.getElementById('stage');
        var prize = document.getElementById('prize');

        var mode = null, boards = [], champion = null;
        var round = 0, clock = null, endAt = 0, clockEl = null, overlay = null;

        // Timers tied to the current round, so nothing fires after quitting or restarting
        function later(fn, ms) {
            var r = round;
            return setTimeout(function () { if (r === round) fn(); }, ms);
        }

        function el(tag, cls, html) {
            var e = document.createElement(tag);
            if (cls) e.className = cls;
            if (html) e.innerHTML = html;
            return e;
        }

        // One player's side: name, progress pips and a 3x3 grid
        function Board(name, cls, onDone, cpu) {
            var self = this;
            this.name = name;
            this.cpu = !!cpu;
            this.onDone = onDone;
            this.el = el('div', 'side ' + cls,
                '<div class="hud"><span class="name"></span><span class="pips"></span></div>' +
                '<div class="board"><div class="grid"></div><div class="flash" aria-live="polite"></div></div>');
            this.el.querySelector('.name').textContent = name;
            this.flashEl = this.el.querySelector('.flash');
            this.pips = [];
            var pipsEl = this.el.querySelector('.pips');
            for (var p = 0; p < TARGET; p++) this.pips.push(pipsEl.appendChild(el('span', 'pip')));
            this.holes = [];
            var grid = this.el.querySelector('.grid');
            for (var i = 0; i < 9; i++) {
                var h = el('button', 'hole', '<img src="/brendan-morris.jpg" alt="" draggable="false">');
                h.type = 'button';
                h.setAttribute('aria-label', 'Empty');
                if (this.cpu) h.tabIndex = -1;
                else h.addEventListener('pointerdown', (function (n) {
                    return function (e) { e.preventDefault(); self.whack(n); };
                })(i));
                this.holes.push(grid.appendChild(h));
            }
            this.reset();
        }
        Board.prototype.reset = function () {
            this.stop();
            this.score = 0;
            this.active = -1;
            this.done = false;
            this.pips.forEach(function (p) { p.classList.remove('on'); });
            this.flash('');
        };
        Board.prototype.start = function () {
            this.running = true;
            this.pop();
        };
        Board.prototype.stop = function () {
            this.running = false;
            clearTimeout(this.popTimer);
            clearTimeout(this.cpuTimer);
            this.holes.forEach(function (h) {
                h.classList.remove('up', 'hit');
                h.setAttribute('aria-label', 'Empty');
            });
        };
        Board.prototype.pop = function () {
            if (!this.running) return;
            var self = this, next;
            if (this.active >= 0) {
                this.holes[this.active].classList.remove('up', 'hit');
                this.holes[this.active].setAttribute('aria-label', 'Empty');
            }
            do { next = Math.floor(Math.random() * 9); } while (next === this.active);
            this.active = next;
            this.holes[next].classList.add('up');
            this.holes[next].setAttribute('aria-label', 'Brendan! Tap him');
            // He stays up for less time as you catch him
            var stay = Math.max(520, 950 - this.score * 60);
            this.popTimer = setTimeout(function () { self.pop(); }, stay);
            if (this.cpu) {
                // The Elite Brendan is quick, but slips up once he's sped up
                var reaction = 420 + Math.random() * 480;
                if (reaction < stay) this.cpuTimer = setTimeout(function () { self.whack(next); }, reaction);
            }
        };
        Board.prototype.whack = function (i) {
            if (!this.running) return;
            var hole = this.holes[i], self = this;
            if (i !== this.active || hole.classList.contains('hit')) {
                hole.classList.remove('miss');
                void hole.offsetWidth;
                hole.classList.add('miss');
                return;
            }
            hole.classList.add('hit');
            this.pips[this.score].classList.add('on');
            this.score++;
            if (navigator.vibrate && !this.cpu) navigator.vibrate(30);
            if (this.score >= TARGET) {
                this.done = true;
                this.stop();
                this.onDone(this);
                return;
            }
            clearTimeout(this.popTimer);
            clearTimeout(this.cpuTimer);
            this.popTimer = setTimeout(function () { self.pop(); }, 180);
        };
        Board.prototype.flash = function (html, ms) {
            this.flashEl.innerHTML = html;
            this.flashEl.classList.toggle('on', !!html);
            if (html && ms) {
                var f = this.flashEl;
                later(function () { f.classList.remove('on'); }, ms);
            }
        };

        function show(view) {
            [menu, stage, prize].forEach(function (v) { v.hidden = v !== view; });
            document.body.style.overflow = view === stage ? 'hidden' : '';
            window.scrollTo(0, 0);
        }

        function card(title, body, actions) {
            closeCard();
            overlay = el('div', 'overlay',
                '<div class="card" role="dialog" aria-modal="true"><h2></h2><p></p><div class="actions"></div></div>');
            overlay.querySelector('h2').innerHTML = title;
            overlay.querySelector('p').innerHTML = body;
            var row = overlay.querySelector('.actions');
            actions.forEach(function (a, n) {
                var b = el('button', n === 0 ? 'btn' : 'btn ghost');
                b.type = 'button';
                b.textContent = a[0];
                b.addEventListener('click', a[1]);
                row.appendChild(b);
            });
            stage.appendChild(overlay);
            row.firstChild.focus();
        }

        function closeCard() {
            if (overlay) overlay.remove();
            overlay = null;
        }

        function setClock(s) {
            clockEl.textContent = s;
            clockEl.classList.toggle('low', s <= 5);
        }

        function stopAll() {
            clearInterval(clock);
            boards.forEach(function (b) { b.stop(); });
        }

        function teardown() {
            round++;
            stopAll();
            closeCard();
            stage.innerHTML = '';
            boards = [];
        }

        function toMenu() {
            teardown();
            show(menu);
        }

        var MENU = ['Menu', toMenu];
        var LABELS = { solo: '1 player', team: 'Team up', versus: 'Head to head', boss: 'Champions' };

        function enter(m) {
            teardown();
            mode = m;
            var bar = el('div', 'bar', '<button class="quit" type="button">✕ Quit</button><div class="clock">' + SECONDS + '</div><div class="label"></div>');
            bar.querySelector('.label').textContent = LABELS[m];
            bar.querySelector('.quit').addEventListener('click', toMenu);
            clockEl = bar.querySelector('.clock');

            if (m === 'solo') {
                boards = [new Board('You', 'p1', soloDone)];
                stage.append(bar, boards[0].el);
            } else if (m === 'boss') {
                boards = [new Board(champion.name, 'p1', bossDone), new Board('👑 The Elite Brendan', 'elite', bossDone, true)];
                stage.append(boards[1].el, bar, boards[0].el);
            } else {
                var done = m === 'team' ? teamDone : versusDone;
                boards = [new Board('Player 1', 'p1', done), new Board('Player 2', 'p2 flip', done)];
                stage.append(boards[1].el, bar, boards[0].el);
            }
            boards.forEach(function (b, n) { b.opponent = boards[1 - n]; });
            show(stage);

            var go = ['Start', startRound];
            if (m === 'solo') {
                card('Catch <span>Brendan</span>', 'Tap Brendan when he pops up. Catch him 7 times in 20 seconds. He gets faster as you go.', [go, MENU]);
            } else if (m === 'team') {
                card('Team <span>up</span>', 'Put the phone flat between you and sit opposite each other. You each get a grid. You <b>both</b> need 7 before the 20 seconds run out.', [go, MENU]);
            } else if (m === 'versus') {
                card('Head to <span>head</span>', 'Put the phone flat between you and sit opposite each other. First to 7 wins. The winner faces <b>the Elite Brendan</b> in the Champions round.', [go, MENU]);
            } else {
                card('Champions <span>round</span>', '<b>' + champion.name + '</b>, take the phone. You play the bottom grid against 👑 the Elite Brendan, the computer, at the top.<br><br>First to 7 wins. Ties go to Brendan.', [go, MENU]);
            }
        }

        function startRound() {
            round++;
            closeCard();
            stopAll();
            boards.forEach(function (b) { b.reset(); });
            setClock(SECONDS);
            ['3', '2', '1', 'Go!'].forEach(function (t, n) {
                later(function () {
                    boards.forEach(function (b) { b.flash(t, n === 3 ? 500 : 0); });
                }, n * COUNT_STEP);
            });
            later(begin, 3 * COUNT_STEP);
        }

        function begin() {
            endAt = Date.now() + SECONDS * 1000;
            clock = setInterval(tick, 100);
            boards.forEach(function (b) { b.start(); });
        }

        function tick() {
            var left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
            setClock(left);
            if (left === 0) timeUp();
        }

        // Show the result on the grids for a moment, then the next step
        function finish(next) {
            stopAll();
            later(next, RESULT_PAUSE);
        }

        function soloDone(b) {
            b.flash('Caught! 🎉');
            finish(showPrize);
        }

        function teamDone(b) {
            if (!b.opponent.done) {
                b.flash('7/7 ✓<small>Now cheer your mate on</small>');
                return;
            }
            boards.forEach(function (x) { x.flash('You did it! 🎉'); });
            finish(showPrize);
        }

        function versusDone(winner) {
            var loser = winner.opponent;
            winner.flash('You win! 🏆');
            loser.flash('You lose 😭');
            champion = { name: winner.name, beat: loser.name };
            finish(function () {
                card('<span>' + winner.name + '</span> wins ' + winner.score + '–' + loser.score,
                    loser.name + ', shake their hand. ' + winner.name + ', you’ve earned the Champions round: beat the Elite Brendan to unlock the secret.',
                    [['Face the Elite Brendan', function () { enter('boss'); }], ['Rematch', startRound], MENU]);
            });
        }

        function bossDone(winner) {
            var you = boards[0], elite = boards[1];
            if (winner === you) {
                you.flash('You win! 🏆');
                elite.flash('Impossible 😱');
                finish(showPrize);
                return;
            }
            you.flash('Brendan wins');
            elite.flash('Too easy 😈');
            finish(function () {
                card('👑 The Elite Brendan <span>wins</span>', elite.score + '–' + you.score + '. ' + you.name + ', want another go?',
                    [['Try again', startRound], MENU]);
            });
        }

        function timeUp() {
            stopAll();
            var a = boards[0], b = boards[1];
            if (mode === 'versus') {
                if (a.score !== b.score) return versusDone(a.score > b.score ? a : b);
                boards.forEach(function (x) { x.flash('Draw'); });
                return finish(function () {
                    card('It’s a <span>draw</span>', a.score + '–' + b.score + '. Go again to find a champion.', [['Rematch', startRound], MENU]);
                });
            }
            if (mode === 'boss') return bossDone(a.score > b.score ? a : b);
            boards.forEach(function (x) { x.flash(x.done ? '7/7 ✓' : 'Time’s up'); });
            finish(function () {
                if (mode === 'team') {
                    card('Brendan <span>escaped</span>', 'Player 1 got ' + a.score + '/7 and Player 2 got ' + b.score + '/7. You both need 7.', [['Try again', startRound], MENU]);
                } else {
                    card('Time’s <span>up</span>', 'You caught Brendan ' + a.score + ' of 7 times.' + (a.score >= 5 ? ' So close.' : ''), [['Try again', startRound], MENU]);
                }
            });
        }

        function showPrize() {
            var title = 'You caught <span>him</span>!', sub = 'Welcome to the secret Brendan Comedy Group.';
            if (mode === 'team') {
                title = 'You <span>both</span> caught him!';
                sub = 'Teamwork. Welcome to the secret Brendan Comedy Group.';
            } else if (mode === 'boss') {
                title = '<span>' + champion.name + '</span> beat the Elite Brendan!';
                sub = 'Champion of the Brendan Comedy Group. ' + champion.beat + ', you’re still part of the community.';
            }
            prize.querySelector('[data-title]').innerHTML = title;
            prize.querySelector('[data-sub]').textContent = sub;
            teardown();
            show(prize);
            confetti();
        }

        function confetti() {
            var colours = ['#ff3d8d', '#7ce8ff', '#f08a8f', '#ffffff', '#0a8fe0'];
            for (var i = 0; i < 80; i++) {
                var c = el('div', 'confetti');
                c.style.left = Math.random() * 100 + 'vw';
                c.style.background = colours[i % colours.length];
                c.style.animationDuration = (1.8 + Math.random() * 1.8) + 's';
                c.style.animationDelay = Math.random() * .6 + 's';
                document.body.appendChild(c);
                c.addEventListener('animationend', c.remove.bind(c));
            }
        }

        document.querySelectorAll('[data-mode]').forEach(function (b) {
            b.addEventListener('click', function () { enter(b.dataset.mode); });
        });
        prize.querySelector('[data-again]').addEventListener('click', function () {
            enter(mode === 'boss' ? 'versus' : mode);
        });
        prize.querySelector('[data-menu]').addEventListener('click', toMenu);
    })();
    </script>
</body>
</html>
